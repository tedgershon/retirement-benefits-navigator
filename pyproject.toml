[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retirement-benefits-navigator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "beautifulsoup4>=4.13,<5", "PyYAML>=6,<7", "pdfminer.six>=2025", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
benefits = "pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["pipeline*"]
